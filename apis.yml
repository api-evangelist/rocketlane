aid: rocketlane
name: Rocketlane
description: Rocketlane is an AI-powered Professional Services Automation (PSA) platform
  that unifies customer onboarding, project delivery, resource management, time
  tracking, and professional-services financials in one system. Its public REST API
  (base https://api.rocketlane.com/api/1.0/) exposes projects, tasks, phases, spaces,
  space documents, custom fields, time entries, time-offs, resource allocations,
  users, and invoices, authenticated with a workspace api-key header and paginated
  with cursors. Outbound webhooks broadcast task, project, and phase lifecycle
  events, and a first-party CLI (@rocketlane/rli) supports building apps for the
  Rocketlane Marketplace. Originally added to the API Evangelist network as a
  portfolio-company lead (8vc, Insight Partners); enriched from its live developer
  surface.
