notes: Rocketlane documents two per-minute limits — 60 requests/min for the "Get all"
  list endpoints and 200 requests/min across all methods. Exceeding either returns
  HTTP 429 ("Rate limit exceeded") with an X-Retry-After header carrying the epoch-millisecond
  timestamp from which requests may resume. No X-RateLimit-Limit/Remaining/Reset headers
  are documented.
