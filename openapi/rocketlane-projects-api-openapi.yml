components:
  schemas:
    SubscriptionFinancialsPublicRequest:
      required:
      - noOfPeriods
      - periodBudget
      - periodMinutes
      - subscriptionFrequency
      - subscriptionStartDate
      type: object
      properties:
        subscriptionFrequency:
          type: string
          description: Refers to the interval at which a subscription renews or takes place, such as on a monthly, quarterly, or yearly basis.
          example: MONTHLY
          enum:
          - MONTHLY
          - QUARTERLY
          - HALF_YEARLY
          - YEARLY
        subscriptionStartDate:
          type: string
          description: The subscription start date is the date when the subscription interval begins. The format for the subscription start date is YYYY-MM-DD.
          example: '2023-03-28'
        periodMinutes:
          minimum: 1
          type: integer
          description: Period minutes refer to the budgeted minutes for each subscription period.
          format: int32
          example: 60
        periodBudget:
          type: number
          description: Period budget represents the fixed budget of every subscription period.
          format: double
          example: 10000
        noOfPeriods:
          minimum: 1
          type: integer
          description: Represents the number of periods in a subscription.
          format: int32
          example: 10
      description: This section addresses the financial aspects of the Subscription contract type projects and its associated fields.
    ProjectFieldPublicResponseAPIEntity:
      type: object
      properties:
        fieldId:
          minimum: 1
          type: integer
          description: The field identifier
          format: int64
          readOnly: true
          example: 201
        fieldLabel:
          type: string
          description: The `fieldLabel` is the name of the custom project field
          readOnly: true
          example: MRR
        fieldValue:
          type: string
          description: The `fieldValue` is the value provided while creation or updating. The fieldValue can be a string, an integer, or an number array and it must match the type of the field. Refer [examples](https://developer.rocketlane.com/v1.0/docs/custom-fields#examples-of-requests-and-responses-for-assigning-custom-field-values) to know how each `field_type` is associated with project.
          readOnly: true
          example: '1000'
        fieldValueLabel:
          type: string
          description: The `fieldValueLabel` is the value provided while creation or updating in a String format.
          readOnly: true
          example: '1000'
      description: Fields lists the custom project fields whose values were provided during project creation or updated later. Refer these [examples](https://developer.rocketlane.com/v1.0/docs/custom-fields#examples-of-requests-and-responses-for-assigning-custom-field-values) to know more about different types of custom fields returned in response.
