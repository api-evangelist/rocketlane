    ProjectFinancialsMetrics:
      type: object
      properties:
        actualRevenue:
          type: number
          description: The revenue you are making on the project. For a time and material project, `Actual Revenue = Sum of all (Tracked time * Bill rates for the roles)`. For a fixed fee project, this is the recognised revenue for the project.
          format: double
          readOnly: true
          example: 10000
        estimatedRevenue:
          type: number
          description: This is the potential revenue you can generate from the project based on your resource allocation plan.
          format: double
          readOnly: true
          example: 200000
        actualCost:
          type: number
          description: The actual cost incurred on the project. `Actual Cost = Sum of all (Tracked time * Cost rates for the team members)`.
          format: double
          readOnly: true
          example: 200
        estimatedCost:
          type: number
          description: This is the potential cost you will incur on the project based on your resource allocation plan. `Estimated Cost = Sum of all (Allocated time * Cost rates for the team members)`.
          format: double
          readOnly: true
          example: 200
        actualProfit:
          type: number
          description: The actual profit you are making on the project. `Profit = Revenue - Cost`.
          format: double
          readOnly: true
          example: 200
        estimatedProfit:
          type: number
          description: This is the potential profit you will make on the project. `Estimated Profit = Estimated Revenue - Estimated Cost`.
          format: double
          readOnly: true
          example: 200
        actualProfitMargin:
          type: number
          description: The actual profit margin for the project. Tracking the profit margin helps you monitor the profitability of the project throughout its duration. `Margin (%) = Profit / Revenue * 100`.
          format: double
          readOnly: true
          example: 200
        estimatedProfitMargin:
          type: number
          description: This is the potential margin you will make on the project. `Estimated Profit Margin (%) = Estimated Profit / Estimated Revenue * 100`.
          format: double
          readOnly: true
          example: 200
        estimateAtCompletion:
          type: number
          description: EAC (Estimate at Completion) predicts the total number of hours that would be consumed at project completion.
          format: double
          readOnly: true
          example: 200
        estimationToCompletionInHours:
          type: number
          description: ETC (Estimate to Complete) refers to number of hours required to complete a project based on the resource allocation plan.
          format: double
          readOnly: true
          example: 200
      description: The metrics used to evaluate and assess the financial aspects of projects.
