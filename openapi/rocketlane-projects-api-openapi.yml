        dueDateActual:
          type: string
          description: The date when project status gets changed to completed. The status can be either the default provided status (completed) or a custom status that is labelled under the Completed category.  It will be null if the project is yet to be completed. The format for the actual due date is _YYYY-MM-DD_.
          example: '2023-03-28'
        annualizedRecurringRevenue:
          type: integer
          description: Indicates the value of the recurring revenue of the customer's subscriptions for a single calendar year.
          format: int64
          example: 10000
        projectFee:
          type: integer
          description: The total fee that is charged for the project.
          format: int64
          example: 100000
        budgetedHours:
          type: number
          description: 'Budgeted hours represent the total hours allocated for project execution. This value can be edited at any point throughout the project''s duration. You can enter the budgeted hours in decimal form, including both hours and minutes, with up to two decimal places of precision. Eg: 1.65 hrs = 1h 39m(1.65h * 60m = 99m).'
          format: double
          readOnly: true
          example: 10.5
        percentageBudgetedHoursConsumed:
          type: number
          description: The budgeted hours consumed percentage.
          format: double
          readOnly: true
          example: 42
        percentageBudgetConsumed:
          type: number
          description: The budget consumed percentage.
          format: double
          readOnly: true
          example: 42
        trackedHours:
          type: integer
          description: The number of hours tracked as part of `submitted` time-entries are captured here and computed in hours.
          format: int32
          readOnly: true
          example: 530
        trackedMinutes:
          type: number
          description: The number of minutes tracked as part of `submitted` time-entries are captured here and computed in minutes.
          format: double
          readOnly: true
          example: 530
        allocatedHours:
          type: integer
          description: If the project has `allocations` against say users or placeholders, it is collected and computed in hours.
          format: int32
          readOnly: true
          example: 500
        allocatedMinutes:
          type: number
          description: If the project has `allocations` against say users or placeholders, it is collected and computed in minutes.
          format: double
          readOnly: true
          example: 500
        billableHours:
          type: integer
          description: If the project has time entries tracked under billable, it is collected and computed in hours.
          format: int32
          readOnly: true
          example: 500
        billableMinutes:
          type: number
          description: If the project has time entries tracked under billable, it is collected and computed in minutes.
          format: double
          readOnly: true
          example: 500
        nonBillableHours:
          type: integer
          description: If the project has time entries tracked under non-billable, it is collected and computed in hours.
          format: int32
          readOnly: true
          example: 500
        nonBillableMinutes:
          type: number
          description: If the project has time entries tracked under non-billable, it is collected and computed in minutes.
          format: double
          readOnly: true
          example: 500
        remainingHours:
          type: integer
          description: Number of hours left to complete the project or task based on tracked and budgeted hours.
          format: int32
          readOnly: true
          example: 530
        remainingMinutes:
          type: integer
          description: Number of minutes left to complete the project or task and complements RemainingHours.
          format: int32
          readOnly: true
          example: 530
        progressPercentage:
          type: integer
          description: The progress percentage is computed based on the number of tasks that are completed vs the total number of tasks in the project. This can be used to track how much the project has progressed over time.
          format: int32
          readOnly: true
          example: 42
        currentPhases:
          type: array
          description: The phases that are currently marked as in progress are available here.
          readOnly: true
          items:
            $ref: '#/components/schemas/ProjectPhasePublicLiteAPIResponseEntity'
        autoAllocation:
          type: boolean
          description: The field autoAllocation defines whether Auto Allocation is enabled for the project or not. If auto allocation is enabled, instead of adding it manually, the allocations are computed from the tasks duration, effort and the assignees specified in the project.
          example: false
        sources:
          type: array
          description: Sources denotes the project templates involved in creation/ imported post creation of the project.
          readOnly: true
          items:
            $ref: '#/components/schemas/ImportPublicAPIResponseEntity'
        plannedDurationInDays:
          type: integer
          description: The difference between `startDate` and `dueDate` is computed and stored in days as `plannedDurationInDays`.
          format: int32
          readOnly: true
          example: 24
        inferredProgress:
          type: string
          description: 'The `inferredProgress` can be used to know whether the project''s progress is as per the expectation. For eg: the value `ON_TRACK` specifies that the project is in good state and not further action would be necessary to track the progress of it, whereas the value `RUNNING_LATE` means that the project state deviates from the original plan and needs immediate attention.'
          readOnly: true
          example: RUNNING_LATE
          enum:
          - ON_TRACK
          - AHEAD_OF_TIME
          - RUNNING_LATE
          - NONE
        projectAgeInDays:
          type: integer
          description: If both the project actual dates (`startDateActual` and `dueDateActual`) are available, the difference is computed and shown in days. If `dueDateActual` isn't available, then the value is computed by the difference of today's date and the available date under `startDateActual`. The value will be null or not present if `startDateActual` is not available.
          format: int32
          readOnly: true
          example: 38
        customersInvited:
          type: integer
          description: Reflects the number of customers that have been invited to the project.
          format: int32
          readOnly: true
          example: 5
        customersJoined:
          type: integer
          description: CustomersJoined tracks the actual number of customers who joined the project after being invited. It is mostly used to track customer engagement.
          format: int32
          readOnly: true
          example: 12
        externalReferenceId:
          type: string
          description: An externalReferenceId is a unique identifier that links entities or transactions between external systems and Rocketlane, ensuring accurate data correlation and consistency.
          readOnly: true
          example: pr_8171
