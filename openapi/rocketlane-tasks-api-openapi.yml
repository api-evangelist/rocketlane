components:
  schemas:
    TaskDependencyPredecessorPublicRequest:
      type: object
      properties:
        taskId:
          minimum: 1
          type: integer
          description: The task's unique, system-generated **identifier**, which can be used to identify the task globally
          format: int64
          example: 201
      description: Task Dependencies allow you to define relationships between tasks that are dependent on each other.
      example: 201
    TaskPublicAPIRequestEntity:
      required:
      - project
      - taskName
      type: object
      properties:
        taskId:
          minimum: 1
          type: integer
          description: The task's unique, system-generated **identifier**, which can be used to identify the task globally
          format: int64
          readOnly: true
          example: 201
        taskName:
          type: string
          description: The **name** of the task.
          example: Kick off
        taskDescription:
          type: string
          description: The `description` of the task. The description body needs to be in **html** format to avoid any formatting issues in the application.
          example: <p>Schedule Kick off meeting with the stakeholders involved.</p>
        taskPrivateNote:
          type: string
          description: The `privateNote` for the task is intended exclusively for team members. The note's content should be in `HTML` format to prevent any formatting issues in the application.
          example: <p>Schedule Kick off meeting with the stakeholders involved.</p>
        startDate:
          type: string
          description: The date when a task starts its execution. It can be empty. The format for the start date is _YYYY-MM-DD_.
          example: '2023-03-28'
        dueDate:
          type: string
          description: The date when a task completes its execution. It can be empty. If both `startDate` and `dueDate` are specified for a given task, it is necessary that the latter should be on or after the given `startDate`. The format for the due date is _YYYY-MM-DD_.
          example: '2023-03-28'
        effortInMinutes:
          type: integer
          description: The effort is the expected time required to complete the task. The value is determined in minutes.
          format: int32
          example: 3000
        progress:
          type: integer
          description: The task's progress, if indicated, will be available here and ranges in value from 0 to 100. The task's status can be used in place of this field, however progress can offer more precise data.
          format: int32
          example: 50
        atRisk:
          type: boolean
          description: Indicates whether the task has been marked as At Risk. This parameter is used to indicate that immediate action is necessary to unblock the task's execution.
          example: true
        type:
          type: string
          description: 'The type of the task if specified will be available here. There are two options: `MILESTONE` or `TASK`. If a task is not explicitly marked as a milestone, it takes the default value as `TASK`. Milestones refer to critical tasks in the project that include an inbuilt CSAT capability that allows customers to offer CSAT evaluations depending on the task''s execution.'
          example: MILESTONE
          enum:
          - TASK
          - MILESTONE
        project:
          $ref: '#/components/schemas/ProjectPublicAPITaskRequestEntity'
        phase:
          $ref: '#/components/schemas/TaskPhasePublicAPIRequestEntity'
        status:
          $ref: '#/components/schemas/TaskStatusPublicRequest'
        fields:
          type: array
          description: The custom fields can be set during the task creation with the help of `fields`. The `fieldValue` can be either a string or a number or an array and it has to comply with the type of the field. Refer [examples](https://developer.rocketlane.com/v1.0/docs/custom-fields#examples-of-requests-and-responses-for-assigning-custom-field-values) to know how to assign `fieldValue` based on their `field_type`.
          items:
            $ref: '#/components/schemas/FieldPublicRequestAPIEntity'
        assignees:
          $ref: '#/components/schemas/TaskAssigneePublicRequestAPI'
        followers:
          $ref: '#/components/schemas/TaskFollowersPublicRequest'
        parent:
          $ref: '#/components/schemas/TaskParentPublicRequestAPI'
        externalReferenceId:
          type: string
          description: An externalReferenceId is a unique identifier that links entities or transactions between external systems and Rocketlane, ensuring accurate data correlation and consistency.
          example: task_8171
        source:
          $ref: '#/components/schemas/TaskImportSourcePublicRequest'
        private:
          type: boolean
          description: This depicts if the task is private or not.
          example: false
    ExamplePaginationTasks:
      type: object
      properties:
        pageSize:
          type: integer
          description: Denotes the page size mentioned in the current request (limit). It defaults to 100 if left blank.
          format: int32
          example: 100
        hasMore:
          type: boolean
          description: Tells us if there is more content.
          example: true
        totalRecordCount:
          type: integer
          description: Denotes the total resources matching the filters.
          format: int64
          example: 10398
        nextPage:
          type: string
          description: Denotes an API URL, which can be conveniently called to perform the subsequent search call to get to the next page.
          example: https://api.rocketlane.com/api/1.0/tasks?includeFields=category,minutes&billable.eq=false&sortBy=startDate&sortOrder=desc&pageToken=e4a3dd8e-e338-11ed-b5ea-0242ac120002&limit=100&assignee.any=1&startDate.gt=2022-01-02
        nextPageToken:
          type: string
          description: Denotes a unique token that points to the next page of resources. To get results from subsequent pages, you can use the nextPageToken available in the response under pagination. This token is valid for 15 minutes.
          example: e4a3dd8e-e338-11ed-b5ea-0242ac120002
